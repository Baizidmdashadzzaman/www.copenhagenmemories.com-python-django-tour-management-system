{% load translate_tags %}
<style>
.customer-chat-float{
	position:fixed;
	width:50px;
	height:50px;
	bottom:60px;
	right:40px;
	background-color:#D4483B;
	color:#FFF;
	border-radius:50px;
	text-align:center;
  font-size:30px;
  z-index:9999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease;
  cursor: pointer;
}

.customer-chat-float:hover{
    transform: scale(1.1);
}

.customer-chat-popup {
  display: none;
  position: fixed;
  bottom: 0;
  right: 15px;
  border: 1px solid #ddd;
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  z-index: 10000;
  background-color: white;
  width: 350px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.customer-chat-container {
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.customer-chat-body-content {
  background-color: #f9f9f9;
  padding: 10px;
  border-radius: 5px;
  height: 400px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  margin-bottom: 10px;
  border: 1px solid #eee;
}

.customer-chat-msg {
  display: flex;
  flex-direction: column;
  margin: 5px 0;
  max-width: 85%;
  word-wrap: break-word;
}

.customer-chat-msg.left {
  align-self: flex-start;
  background-color: #e4e6eb;
  border-radius: 15px 15px 15px 0;
  padding: 8px 12px;
  color: #000;
}

.customer-chat-msg.right {
  align-self: flex-end;
  background-color: #D4483B;
  border-radius: 15px 15px 0 15px;
  padding: 8px 12px;
  color: #fff;
}

.customer-chat-msg .text {
  font-size: 14px;
  line-height: 1.4;
}

.customer-chat-msg .time {
  font-size: 10px;
  margin-top: 4px;
  opacity: 0.7;
}

.customer-chat-msg.left .time {
    text-align: left;
    color: #666;
}

.customer-chat-msg.right .time {
    text-align: right;
    color: #eee;
}

#customerMessageInput {
    border-radius: 20px;
    padding-left: 15px;
}

.customer-chat-header {
    background-color: #D4483B;
    color: white;
    padding: 10px 15px;
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.customer-chat-header h5 {
    margin: 0;
    font-size: 16px;
    font-weight: bold;
}

.customer-chat-close {
    cursor: pointer;
    font-size: 20px;
}
</style>

<div class="customer-chat-float" onclick="openCustomerChat()">
    <i class="isax isax-message"></i>
</div>

<div class="customer-chat-popup" id="customerChatPopup">
   <div class="customer-chat-header">
       <h5>{% translate "Chat with us" %}</h5>
       <span class="customer-chat-close" onclick="closeCustomerChat()">&times;</span>
   </div>
   <div class="customer-chat-container">
       <div class="customer-chat-body-content" id="customerChatBox">
           <!-- Messages will be loaded here -->
       </div>

       <form id="customerChatForm">
           {% csrf_token %}
           <div class="input-group mb-2">
               <input type="text" id="customerMessageInput" placeholder="{% translate 'Type a message...' %}" required class="form-control">
               <button type="submit" class="btn btn-primary" style="border-radius: 0 20px 20px 0;">
                   <i class="isax isax-send-1"></i>
               </button>
           </div>
       </form>
   </div>
</div>

<script>
  let customerChatPollInterval;

  function setCustomerCookie(name, value, days) {
      var expires = "";
      if (days) {
          var date = new Date();
          date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
          expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + (value || "") + expires + "; path=/";
  }

  function getCustomerCookie(name) {
      var nameEQ = name + "=";
      var ca = document.cookie.split(';');
      for (var i = 0; i < ca.length; i++) {
          var c = ca[i];
          while (c.charAt(0) == ' ') c = c.substring(1, c.length);
          if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
      }
      return null;
  }

  // Initialize unique_customer_id if not present
  if (!getCustomerCookie('unique_customer_id')) {
      const uniqueId = 'cust_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
      setCustomerCookie('unique_customer_id', uniqueId, 30); // 30 days
  }

  function formatCustomerChatDate(dateString) {
      try {
          const date = new Date(dateString);
          if (isNaN(date.getTime())) return "";
          return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
          return "";
      }
  }

  function appendCustomerChatMessage(text, side = 'left', timeStr = '') {
        const messageHtml = `
            <div class="customer-chat-msg ${side}">
                <div class="text">${text}</div>
                <div class="time">${timeStr}</div>
            </div>
        `;
        $('#customerChatBox').append(messageHtml);
        const chatBox = $('#customerChatBox')[0];
        if (chatBox) {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

  function loadCustomerChatMessages() {
      $.ajax({
          url: '{% url "customer_chat_messages" %}',
          type: 'GET',
          success: function(res) {
              if(res.status === 'success') {
                  const chatBox = $('#customerChatBox');
                  const isAtBottom = chatBox[0] ? (chatBox[0].scrollHeight - chatBox.scrollTop() === chatBox[0].clientHeight) : true;
                  
                  chatBox.html(''); 
                  
                  if(res.messages && res.messages.length === 0) {
                      chatBox.append('<div class="text-center p-3 text-muted" style="font-size: 13px;">No messages yet. Start a conversation!</div>');
                  } else if (res.messages) {
                      res.messages.forEach(msg => {
                          const side = (msg.admin_id) ? 'left' : 'right';
                          const time = formatCustomerChatDate(msg.created_at);
                          appendCustomerChatMessage(msg.message, side, time);
                      });
                      
                      if (isAtBottom && chatBox[0]) {
                          chatBox.scrollTop(chatBox[0].scrollHeight);
                      }
                  }
              }
          },
          error: function(err) {
              console.error("Failed to load messages", err);
          }
      });
  }

  $('#customerChatForm').on('submit', function(e) {
      e.preventDefault();
      const input = $('#customerMessageInput');
      const message = input.val().trim();
      if (message === '') return;
      
      const csrfToken = $('#customerChatForm [name=csrfmiddlewaretoken]').val();
      
      input.val('');
      
      $.ajax({
          url: '{% url "customer_chat_send" %}',
          type: 'POST',
          data: { 
              message: message,
              csrfmiddlewaretoken: csrfToken
          },
          success: function(res) {
              if(res.status === 'success') {
                  loadCustomerChatMessages(); 
              } else {
                  alert("Error: " + (res.message || "Unknown error"));
              }
          },
          error: function() {
              alert('Failed to send message.');
          }
      });
  });

  function openCustomerChat() {
      document.getElementById("customerChatPopup").style.display = "block";
      loadCustomerChatMessages();
      if(customerChatPollInterval) clearInterval(customerChatPollInterval);
      customerChatPollInterval = setInterval(loadCustomerChatMessages, 5000);
  }

  function closeCustomerChat() {
      document.getElementById("customerChatPopup").style.display = "none";
      if(customerChatPollInterval) clearInterval(customerChatPollInterval);
  }
</script>
